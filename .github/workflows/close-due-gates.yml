name: Close due gates

on:
  schedule:
    # 08:05 UTC: just after midnight Pacific, standard or daylight time.
    - cron: '5 8 * * *'
  workflow_dispatch:

permissions:
  issues: write
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Close each gate whose date has arrived
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          today=$(TZ=America/Los_Angeles date +%F)
          gates=$(gh issue list --state open --limit 500 --json number,title --jq '.[] | "\(.number)\t\(.title)"')
          status=0
          while IFS=$'\t' read -r number title; do
            [[ -n "$number" ]] || continue
            day=$(grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' <<<"$title" | head -n 1 || true)
            if [[ -z "$day" || "$(date -d "$day" +%F 2>/dev/null)" != "$day" ]]; then
              echo "::error::Gate #$number has no valid YYYY-MM-DD date in its title: $title"
              status=1
            elif [[ ! "$day" > "$today" ]]; then
              gh issue close "$number" --reason completed --comment "Closed on $today, Pacific time: its date has arrived."
              echo "Closed #$number ($title)"
            fi
          done <<<"$gates"
          exit "$status"
      - name: Keep the schedule enabled
        # GitHub disables a public repository's scheduled workflows after 60 days without a commit.
        if: ${{ !cancelled() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          read -r sha tree when < <(gh api "repos/$GH_REPO/commits/main" --jq '"\(.sha) \(.commit.tree.sha) \(.commit.committer.date)"')
          age=$(( ($(date +%s) - $(date -d "$when" +%s)) / 86400 ))
          if (( age >= 45 )); then
            commit=$(gh api "repos/$GH_REPO/git/commits" -f message="🔧 chore: Keep the daily gate check enabled" \
              -f tree="$tree" -f "parents[]=$sha" --jq .sha)
            gh api -X PATCH "repos/$GH_REPO/git/refs/heads/main" -f sha="$commit" >/dev/null
            echo "Added an empty commit; main's last commit was $age days old."
          fi
